name: Deploy

on:
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for OIDC auth with AWS

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/dataforge-studio
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging (EKS)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Update kubeconfig for staging cluster
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME_STAGING }} \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy to staging
        run: |
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          kubectl set image deployment/dataforge-studio \
            api=${{ secrets.ECR_REGISTRY }}/dataforge-studio:${IMAGE_TAG} \
            -n dataforge-studio
          kubectl rollout status deployment/dataforge-studio \
            -n dataforge-studio \
            --timeout=300s

      - name: Smoke test staging
        run: |
          STAGING_URL=${{ secrets.STAGING_URL }}
          curl --fail --retry 5 --retry-delay 10 "${STAGING_URL}/healthz" \
            | jq '.status == "healthy"'

  deploy-production:
    name: Deploy to Production (EKS)
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Update kubeconfig for production cluster
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME_PROD }} \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy to production
        run: |
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          kubectl set image deployment/dataforge-studio \
            api=${{ secrets.ECR_REGISTRY }}/dataforge-studio:${IMAGE_TAG} \
            -n dataforge-studio
          kubectl rollout status deployment/dataforge-studio \
            -n dataforge-studio \
            --timeout=300s

      - name: Smoke test production
        run: |
          PROD_URL=${{ secrets.PROD_URL }}
          curl --fail --retry 5 --retry-delay 10 "${PROD_URL}/healthz" \
            | jq '.status == "healthy"'
